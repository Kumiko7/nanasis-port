<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Viewer</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="sound.css">
</head>
<body>
<div id="viewport">
  <div id="screen">

    <!-- ===================== episode select ===================== -->
    <section id="menu" class="scene">
      <div class="m-bg"></div>
      <img class="m-chara" alt="">

      <div id="mTop" class="m-top"></div>

      <div class="m-panel"><div id="mList" class="m-list"></div></div>

      <header class="m-head">
        <button id="mBack" class="sq-btn" aria-label="戻る">
          <svg viewBox="0 0 40 40"><path d="M15 9 5 18l10 9v-6h8a7 7 0 0 1 0 14h-5v5h5a12 12 0 0 0 0-24h-8z"/></svg>
        </button>
        <div class="m-titlebar"><span id="mTitle">エピソード</span>
          <button id="mHelp" class="m-help" aria-label="ヘルプ">?</button></div>
        <div id="mCrumb" class="m-crumb"><span></span></div>
        <button id="mUnread" class="m-check" aria-pressed="false"><i></i><span>未読のみ表示</span></button>
        <button id="mHome" class="sq-btn" aria-label="ホーム">
          <svg viewBox="0 0 40 40"><path d="M20 6 4 20h5v14h22V20h5zm-4 15h3v3h-3zm5 0h3v3h-3zm-5 5h3v3h-3zm5 0h3v3h-3z"/></svg>
        </button>
      </header>

      <div class="m-foot">
        <button id="mSearch" class="m-pill"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg>検索</button>
        <button id="mSettings" class="m-pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>設定</button>
        <div id="mCount" class="m-count"></div>
      </div>
    </section>

    <!-- ===================== サウンドプレイヤー (layout from the game's scene) ===================== -->
    <section id="snd" class="scene" hidden>
      <header class="m-head">
        <button id="sBack" class="sq-btn" aria-label="戻る">
          <svg viewBox="0 0 40 40"><path d="M15 9 5 18l10 9v-6h8a7 7 0 0 1 0 14h-5v5h5a12 12 0 0 0 0-24h-8z"/></svg>
        </button>
        <div class="m-titlebar"><span>サウンドプレイヤー</span></div>
        <button id="sHome" class="sq-btn" aria-label="ホーム">
          <svg viewBox="0 0 40 40"><path d="M20 6 4 20h5v14h22V20h5zm-4 15h3v3h-3zm5 0h3v3h-3zm-5 5h3v3h-3zm5 0h3v3h-3z"/></svg>
        </button>
      </header>

      <div id="sGroups" class="s-groups"></div>

      <div class="s-panel">
        <div id="sList" class="s-list"></div>
        <div id="sEmpty" class="s-empty" hidden>
          <b>楽曲がありません</b>
          <span>※楽曲のメニューボタンから追加先を選ぶ、<br>　または楽曲をドラッグ＆ドロップで追加できます。</span>
        </div>
      </div>

      <div class="s-player">
        <div class="s-light"><img id="sJacket" class="s-jacket" alt=""></div>
        <div id="sNow" class="s-now"></div>
        <div id="sArtist" class="s-artist"></div>
        <div id="sCur" class="s-time cur">0:00</div>
        <div id="sSeek" class="s-seek"><i class="track"></i><i class="fill"></i><i class="knob"></i></div>
        <div id="sLen" class="s-time len">0:00</div>
        <button id="sShuffle" class="s-btn shuffle" aria-label="シャッフル"></button>
        <button id="sPrev" class="s-btn prev" aria-label="前の曲"></button>
        <button id="sPlay" class="s-btn play" aria-label="再生"></button>
        <button id="sNext" class="s-btn next" aria-label="次の曲"></button>
        <button id="sRepeat" class="s-btn repeat" aria-label="リピート"></button>
      </div>

      <div id="sMask" class="s-mask" hidden></div>
    </section>

    <!-- ===================== story player ===================== -->
    <section id="adv" class="scene" hidden>
      <!-- the game's post-process filters (URP volume profiles), as colour matrices in linear RGB:
           gray = saturation -100; sepia = white balance +100, colour filter (1, .878, .552), saturation -60 -->
      <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <filter id="adv-gray"><feColorMatrix type="matrix" values="0.2127 0.7152 0.0722 0 0  0.2127 0.7152 0.0722 0 0  0.2127 0.7152 0.0722 0 0  0 0 0 1 0"/></filter>
        <filter id="adv-sepia"><feColorMatrix type="matrix" values="0.6311 0.5108 0.0203 0 0  0.1441 0.7669 0.0134 0 0  0.1451 0.3941 0.1210 0 0  0 0 0 1 0"/></filter>
      </svg>
      <div id="stage">
        <div id="scene" class="layer">
          <div id="bg" class="layer"><div class="bgimg"></div><div class="bgimg"></div></div>
          <!-- the game's movie image is part of the background (BackCanvas/Screen), under the characters -->
          <video id="movie" class="layer" playsinline></video>
          <div id="charas" class="layer"></div>
          <div id="item" class="layer"></div>
        </div>
        <div id="title" class="layer"></div>
        <div id="fx" class="layer"></div>

        <div id="textbox" hidden>
          <div id="namebox"><span id="speaker"></span></div>
          <div id="msgbox">
            <div id="dialogue"><span class="typed"></span><span class="rest"></span></div>
            <div id="nextMark"></div>
          </div>
          <div id="modeIcon"></div>
        </div>

        <div id="choices" class="layer"></div>
      </div>

      <div id="movieui" hidden>
        <button class="mv-skip">SKIP</button>
        <button class="mv-pause" aria-label="一時停止"><i></i></button>
        <div class="mv-bar"><div class="mv-track"></div><div class="mv-thumb"></div></div>
        <div class="mv-time"><span class="cur">00:00</span><span class="sep">/</span><span class="tot">00:00</span></div>
      </div>

      <div id="advui">
        <button id="menuBtn" class="adv-menu"><span><i></i>MENU</span></button>
        <div id="toolbar" hidden>
          <button id="tbSettings" class="tb-settings">設定</button>
          <div class="tb-strip">
            <button id="tbSkip" class="tb-btn">スキップ</button>
            <button id="tbAuto" class="tb-btn">オート</button>
            <button id="tbFast" class="tb-btn">早送り</button>
            <button id="tbLog" class="tb-btn">ログ･巻戻し</button>
            <button id="tbHide" class="tb-btn">すべて非表示</button>
            <button id="tbQuit" class="tb-btn">中断する</button>
            <button id="tbClose" class="tb-close"><span><i></i>閉じる</span></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== ムービー (sound player's movie list): full-screen, same controls as in stories ===================== -->
    <section id="mvx" class="scene" hidden>
      <video id="mvxVideo" playsinline></video>
      <div id="mvxui" class="mv-ui" hidden>
        <button class="mv-skip">SKIP</button>
        <button class="mv-pause" aria-label="一時停止"><i></i></button>
        <div class="mv-bar"><div class="mv-track"></div><div class="mv-thumb"></div></div>
        <div class="mv-time"><span class="cur">00:00</span><span class="sep">/</span><span class="tot">00:00</span></div>
      </div>
    </section>

    <div id="popups"></div>
    <div id="toast" role="status"></div>
  </div>
</div>

<script src="player.js"></script>
<script src="sound.js"></script>
<script src="app.js"></script>
</body>
</html>
